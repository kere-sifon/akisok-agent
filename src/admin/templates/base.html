<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% block title %}Akisok review{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=IBM+Plex+Mono:wght@400;500&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/static/style.css?v=akisok-site-align" />
  </head>
  <body>
    <header class="site-header">
      <div class="brand-block">
        <a class="brand" href="/">Akisok</a>
        <p class="brand-kicker">Review · local queue</p>
      </div>
      {% set path = request.url.path %}
      <nav class="tabs" aria-label="Primary">
        <a href="/" class="{% if path == '/' %}active{% endif %}">Status</a>
        <a href="/eval-scores" class="{% if path.startswith('/eval-scores') %}active{% endif %}">Eval scores</a>
        <a href="/cost" class="{% if path.startswith('/cost') %}active{% endif %}">Cost</a>
        <a href="/queue" class="{% if path.startswith('/queue') or path.startswith('/items') %}active{% endif %}">Review queue</a>
      </nav>
    </header>
    <main>
      {% if notice %}
      <p class="notice">{{ notice }}</p>
      {% endif %}
      {% block content %}{% endblock %}
    </main>
  </body>
</html>
